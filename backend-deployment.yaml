apiVersion: apps/v1
kind: Deployment

metadata:
  name: dotnet-api-deployment

spec:
  replicas: 2

  selector:
    matchLabels:
      app: dotnet-api

  template:
    metadata:
      labels:
        app: dotnet-api

    spec:
      containers:
      - name: dotnet-api-container

        image: myreactdotnetacr.azurecr.io/dotnet_repo:1.0

        ports:
        - containerPort: 5000

        env:
        - name: ASPNETCORE_URLS
          value: "http://+:5000"

---
apiVersion: v1
kind: Service

metadata:
  name: dotnet-api-service

spec:
  type: LoadBalancer

  selector:
    app: dotnet-api

  ports:
  - protocol: TCP
    port: 80
    targetPort: 5000